name: Setup Blender
description: Install headless Blender (Linux x64, cached) for CPU Cycles rendering
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: cache
      with:
        path: ~/blender
        key: blender-5.3.0-linux-x64
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        url=release/Blender5.3/blender-5.3.0-linux-x64.tar.xz
        for mirror in https://download.blender.org https://mirrors.ocf.berkeley.edu/blender https://ftp.nluug.nl/pub/graphics/blender; do
          curl -fsSL --retry 5 --retry-delay 10 "$mirror/$url" -o /tmp/blender.tar.xz && break
        done
        mkdir -p ~/blender
        tar -xJf /tmp/blender.tar.xz -C ~/blender --strip-components=1
    - shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 \
          libxkbcommon0 libsm6 libice6 libx11-6 libxext6 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
          libdecor-0-0 libgomp1 >/dev/null
        echo "$HOME/blender" >> "$GITHUB_PATH"
        ~/blender/blender --version | head -1
